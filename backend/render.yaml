services:
  # Backend API Service - Optimized for Render Free Tier
  - type: web
    name: tabble-backend
    runtime: python
    env: python
    region: singapore  # Choose closest to your users
    plan: free

    # Build configuration
    buildCommand: |
      pip install --upgrade pip
      pip install --retries 10 --timeout 60 -r requirements.txt
      mkdir -p app/static/images

    # Start command
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1

    # Health check - UptimeRobot will ping this
    healthCheckPath: /health

    # Persistent disk for images (1GB free)
    disk:
      name: tabble-static
      mountPath: /opt/render/project/src/app/static/images
      sizeGB: 1

    # Environment variables
    envVars:
      - key: RENDER
        value: "true"

      - key: PYTHON_VERSION
        value: "3.11.9"

      # pip resilience — files.pythonhosted.org occasionally 502s; retry instead of failing the build
      - key: PIP_RETRIES
        value: "10"

      - key: PIP_TIMEOUT
        value: "60"

      - key: PORT
        generateValue: true

      - key: HOST
        value: "0.0.0.0"

      - key: DATABASE_TYPE
        value: sqlite

      # Update after frontend deployment
      - key: FRONTEND_URL
        value: https://www.tabble.in

      - key: CORS_ORIGINS
        value: https://www.tabble.in,https://tabble.in

      - key: DEMO_MODE
        value: "true"

      # Tables per hotel — effectively unlimited
      - key: POC_MAX_TABLES_PER_HOTEL
        value: "1000"

      - key: APP_ENV
        value: production

      # Admin password for /adminofthetabble
      - key: ADMIN_PASSWORD
        value: adminoftabble

      # SECRETS - Add via Render Dashboard
      - key: SECRET_KEY
        sync: false

    # Auto-deploy from backend branch
    autoDeploy: true
    branch: main
