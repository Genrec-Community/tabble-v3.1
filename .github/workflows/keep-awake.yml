
name: Keep App Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping FreeLLMAPI Health Endpoint
        run: |
          curl --fail --show-error --silent \
            --max-time 60 \
            --retry 2 \
            --retry-delay 5 \
            "https://genrecai-freellmapi.onrender.com/api/ping"
